<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Fundamentals & Cybersecurity Interactive Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --accent: #0284c7;
            --correct: #10b981;
            --wrong: #ef4444;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Full CSS included in index.html download */
    </style>
</head>
<body>
    <header>
        <h1>IT Fundamentals & Cybersecurity Assessment</h1>
        <p>Interactive Practice Exam</p>
    </header>

    <div class="stats-bar" id="statsBar">
        <span id="questionNum">Question 1 of 60</span>
        <span id="scoreTracker">Score: 0</span>
    </div>

    <div class="quiz-card" id="quizCard">
        <div class="q-tag" id="topicTag">Topic</div>
        <div class="question-text" id="questionText">Loading question...</div>
        <div class="options-list" id="optionsList"></div>
    </div>
</body>
</html>
