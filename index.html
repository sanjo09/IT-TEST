<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to Computing Test ni Jopay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.15);
            
            --correct-bg: rgba(34, 197, 94, 0.1);
            --correct-border: #22c55e;
            --correct-text: #4ade80;
            
            --wrong-bg: rgba(239, 68, 68, 0.1);
            --wrong-border: #ef4444;
            --wrong-text: #f87171;
            
            --unanswered-border: #f59e0b;
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .quiz-container {
            max-width: 840px;
            margin: 0 auto;
        }

        /* Header */
        .quiz-header {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .quiz-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .quiz-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Sticky Result Panel */
        #result-panel {
            display: none;
            position: sticky;
            top: 20px;
            z-index: 100;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid var(--primary);
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25);
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        #result-panel h2 {
            font-size: 1.5rem;
            color: var(--text-main);
        }

        /* Question Cards */
        .question-card {
            background: var(--surface-color);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-bottom: 20px;
            transition: var(--transition);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .question-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .question-card.missing-answer {
            border: 2px solid var(--unanswered-border);
            animation: pulseWarning 1.5s infinite;
        }

        @keyframes pulseWarning {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            display: grid;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .option-label:hover {
            background: var(--surface-hover);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Custom Radio Button */
        .option-label input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            margin-right: 14px;
            outline: none;
            transition: var(--transition);
            position: relative;
            flex-shrink: 0;
        }

        .option-label input[type="radio"]:checked {
            border-color: var(--primary);
            background-color: var(--primary);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .option-label input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background-color: white;
            border-radius: 50%;
        }

        .option-label span {
            font-size: 0.98rem;
            color: #cbd5e1;
        }

        /* Evaluation State Styling */
        .question-card.correct-answer {
            border-left: 4px solid var(--correct-border);
        }

        .question-card.incorrect-answer {
            border-left: 4px solid var(--wrong-border);
        }

        .option-label.is-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
        }

        .option-label.is-correct span {
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-label.is-wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
        }

        .option-label.is-wrong span {
            color: var(--wrong-text) !important;
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 16px;
            margin-top: 35px;
        }

        .btn {
            flex: 1;
            padding: 16px 24px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .reset-btn {
            background: rgba(51, 65, 85, 0.8);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .reset-btn:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        /* Responsive Breakpoints */
        @media (max-width: 640px) {
            body { padding: 20px 12px; }
            .quiz-header { padding: 25px 18px; }
            .quiz-header h1 { font-size: 1.6rem; }
            .question-card { padding: 20px; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="quiz-header">
        <h1>Introduction to Computing Test ni Jopay</h1>
        <p>Complete the scenario-based questions below to test your practical knowledge ANO JAYY?!.</p>
    </div>

    <div id="result-panel">
        <h2 id="score-text">Your Score: 0 / 60</h2>
    </div>

    <form id="quiz-form">
        <div id="questions-wrapper"></div>
        <div class="btn-group">
            <button type="button" class="btn submit-btn" onclick="gradeQuiz()">Submit Test</button>
            <button type="button" class="btn reset-btn" onclick="resetQuiz()">Reset Answers</button>
        </div>
    </form>
</div>

<script>
const quizData = [
    { id: 1, q: "A student receives an email claiming their online student portal will be deactivated unless they immediately click a provided link to verify their account credentials. What cybersecurity threat is being illustrated?", options: ["Ransomware", "Phishing", "Zero-Day Exploit", "Denial-of-Service"], answer: "b" },
    { id: 2, q: "A regional university system needs a central computing system to process hundreds of thousands of student registrations and tuition payment transactions simultaneously without failing. Which class of computer is best suited for this task?", options: ["Supercomputer", "Mainframe", "Workstation", "Microcontroller"], answer: "b" },
    { id: 3, q: "An office manager notices that printing large documents freezes their application. The system administrator explains that the computer sends print jobs to a temporary holding area in memory so the CPU can resume other processing tasks. What is this process called?", options: ["Multitasking", "Spooling", "Booting", "Fragmenting"], answer: "b" },
    { id: 4, q: "A graphic designer takes a physical shoe from a storefront, examines its texture, and then uses a smartphone to locate the same item online for a cheaper price. What behavior is being demonstrated?", options: ["Telecommuting", "Showrooming", "Micro-paying", "Crowdsourcing"], answer: "b" },
    { id: 5, q: "A university IT technician needs to start up a computer that has completely frozen and is unresponsive to standard menu commands. The technician holds down the power button to shut it down and turns it back on. What type of boot is being performed?", options: ["Warm boot", "Cold boot", "Cloud boot", "Secondary boot"], answer: "b" },
    { id: 6, q: "During a medical procedure, a surgeon relies on a high-precision robotic assistant controlled by specialized hardware to execute micro-incisions. How is IT utilized in this context?", options: ["Telemedicine", "Medical Imaging", "Medical Robotics", "Electronic Health Records"], answer: "c" },
    { id: 7, q: "A small business owner is setting up a new office network. When connecting a brand-new specialty receipt printer to a desktop computer, the computer fails to communicate with the printer until a specific software file provided by the manufacturer is installed. What type of software was installed?", options: ["Utility Program", "Device Driver", "Operating System", "Application Software"], answer: "b" },
    { id: 8, q: "While sitting in a public coffee shop, a student connects to an unencrypted open Wi-Fi network. An attacker on the same network manages to position themselves silently between the student’s device and the banking website to intercept login details. What type of attack is this?", options: ["Man-in-the-Middle (MITM)", "Denial-of-Service (DoS)", "Ransomware", "Social Engineering"], answer: "a" },
    { id: 9, q: "An accounting firm wants to evaluate how changes in tax rates might affect overall client profits before making actual investments. They modify values within specific cells of a financial worksheet to instantly view updated calculated totals. Which feature are they using?", options: ["Database Querying", "What-If Analysis", "Mail Merge", "File Defragmentation"], answer: "b" },
    { id: 10, q: "A software developer discovers a critical flaw in a widely used program. Before the software vendor can release a fix, malicious actors begin exploiting this unknown weakness to gain system access. What is this type of vulnerability called?", options: ["Zero-Day Exploit", "Trojan Horse", "Phishing", "Spyware"], answer: "a" },
    { id: 11, q: "An automated assembly line in an automotive plant uses a small, dedicated computing chip built directly inside a robotic welding arm to control its movement and timing. What category does this computing chip belong to?", options: ["Microcomputer", "Workstation", "Microcontroller", "Mainframe"], answer: "c" },
    { id: 12, q: "A research group working on complex climate predictions requires a computing system capable of executing trillions of calculations per second to simulate worldwide weather patterns. Which computer category is required?", options: ["Mainframe", "Supercomputer", "Workstation", "Server"], answer: "b" },
    { id: 13, q: "A company policy requires employees to lock their screens when leaving their desks. To regain access, the employee must enter a valid username and string of secret characters. Which function of the operating system is being enforced?", options: ["CPU Management", "Task Management", "Security Management", "Memory Management"], answer: "c" },
    { id: 14, q: "A student records individual exam scores (82, 88, 94) in a document. Later, a spreadsheet calculates the overall average as 88%. In this scenario, what do the raw individual scores represent?", options: ["Information", "Data", "Software", "Hardware"], answer: "b" },
    { id: 15, q: "An individual uses an online web browser to edit documents stored on a remote server, allowing access to files from any device connected to the internet without installing local software. What technology model is being used?", options: ["Stand-alone Computing", "Cloud Computing", "Desktop Publishing", "Embedded OS"], answer: "b" },
    { id: 16, q: "An enterprise network administrator configures a centralized server to hold shared client files, while individual employee desktop workstations request and save files through this central machine. What system arrangement is in place?", options: ["Peer-to-Peer Network", "Client-Server Network", "Stand-alone Network", "Embedded Network"], answer: "b" },
    { id: 17, q: "An office clerk needs to compress several large project files to email them to a client. However, the files contain financial numbers that must remain exact upon decompression without any loss of data. Which compression technique must be used?", options: ["Lossy Compression", "Lossless Compression", "Rasterization", "Vectorization"], answer: "b" },
    { id: 18, q: "A local hospital system maintains digital files containing patient histories, prescriptions, and diagnostic test results that can be instantly retrieved by authorized doctors across various departments. What technology is being used?", options: ["Telemedicine", "Electronic Health Records", "Virtual Money", "Computer-Aided Design"], answer: "b" },
    { id: 19, q: "An employee wants to ensure their computer’s main storage drive runs smoothly by rearranging scattered file fragments so that files are stored in contiguous sectors. Which system utility should be used?", options: ["Disk Cleanup", "File Defragmentation", "Data Recovery", "Backup Utility"], answer: "b" },
    { id: 20, q: "A project manager needs to create a visual schedule tracking tasks, timelines, team resource allocations, and dependencies to ensure a construction project finishes on time. What type of application software is best suited for this task?", options: ["Personal Information Manager", "Desktop Publishing Software", "Project Management Software", "Presentation Graphics Software"], answer: "c" },
    { id: 21, q: "A student posts public comments and images on social media accounts every day. A potential employer searches the applicant's name online and reviews these posts to evaluate their candidate profile. What concept does this online history reflect?", options: ["Cyberspace", "Digital Footprint", "Weblog", "Algorithm"], answer: "b" },
    { id: 22, q: "An architect is creating detailed 3D structural blueprints for a commercial skyscraper, ensuring precise physical measurements and stress calculations. Which application software is specifically tailored for this work?", options: ["Computer-Aided Design (CAD)", "Desktop Publishing (DTP)", "Presentation Graphics", "Paint Programs"], answer: "a" },
    { id: 23, q: "A caller pretends to be a senior IT support agent and contacts a corporate user, claiming their account is infected with a virus and demanding their login credentials immediately to fix the issue. What technique is the caller using?", options: ["Social Engineering", "Denial-of-Service", "Man-in-the-Middle", "Zero-Day Exploit"], answer: "a" },
    { id: 24, q: "A software company releases a full-featured photo editing program free of charge for a 30-day trial period, after which users must purchase a registration key to continue using it. How is this software distributed?", options: ["Freeware", "Public-domain software", "Shareware", "Rentalware"], answer: "c" },
    { id: 25, q: "A company server suddenly receives millions of simultaneous fake web requests from multiple compromised computers, causing the official website to slow down and crash for real customers. What type of attack has occurred?", options: ["Ransomware", "Distributed Denial-of-Service (DDoS)", "Phishing", "Spyware"], answer: "b" },
    { id: 26, q: "An administrator sets up an operating system designed specifically to coordinate resources, manage network traffic, and handle file access for dozens of connected desktop computers on a campus LAN. What class of OS is this?", options: ["Stand-alone Operating System", "Embedded Operating System", "Network Operating System", "Legacy Operating System"], answer: "c" },
    { id: 27, q: "A student wants to adjust the left margin and center-align the main heading of a research paper. Which core software category handles these layout and text appearance adjustments?", options: ["System Software", "Utility Software", "Application Software (Word Processing)", "Device Driver Software"], answer: "c" },
    { id: 28, q: "An author wants to create a visual outline of a multi-chapter book by organizing main section titles and subheadings into structured structural levels within a document editor. Which feature facilitates this hierarchy?", options: ["Word Wrap", "Outline View / Head Hierarchy", "Mail Merge", "Thesaurus"], answer: "b" },
    { id: 29, q: "An executive needs a single portable device that combines cellular calling, internet browsing, camera capture, satellite navigation, and mobile payments. What concept is illustrated by combining these technologies into one device?", options: ["Miniaturization", "Convergence", "Automation", "Customization"], answer: "b" },
    { id: 30, q: "A non-profit organization uses an open-source operating system that allows free modification of its underlying source code by developers worldwide, as long as changes remain uncopyrighted. Which operating system fits this description?", options: ["Microsoft Windows", "Mac OS X", "Linux", "MS-DOS"], answer: "c" },
    { id: 31, q: "An online retailer automatically updates product stock counts, generates digital receipts, and sends email notifications as soon as a customer completes an online purchase. What IT capability is being demonstrated?", options: ["Telecommute", "Automation", "Showrooming", "Social Engineering"], answer: "b" },
    { id: 32, q: "A student needs to write a computer program that instructs the hardware to execute mathematical calculations. After writing the initial human-readable source code, what type of file must it be converted into so the computer can run it directly?", options: ["Data File", "Executable File", "ASCII File", "Utility File"], answer: "b" },
    { id: 33, q: "A graphics artist wants to draw a company logo that can be scaled up to fit a massive billboard without losing clarity or becoming pixelated. Which type of graphic software and image format should be used?", options: ["Painting program creating raster/bitmapped images", "Drawing program creating vector images", "Video-editing program creating lossy images", "Photo management program creating compressed JPEG images"], answer: "b" },
    { id: 34, q: "A firm uses a software application that allows an unlimited number of installed copies across their single office facility under one blanket agreement. Which type of software license do they hold?", options: ["Single-user license", "Concurrent-user license", "Site license", "Multiple-user license"], answer: "c" },
    { id: 35, q: "An employee opens a spreadsheet containing thousands of rows to extract specific employee records where the department is listed as 'Marketing' and salary exceeds a specified threshold. Which database or spreadsheet operation allows this rapid filtering?", options: ["Querying", "Spooling", "Formatting", "Booting"], answer: "a" },
    { id: 36, q: "A medical research lab uses high-definition X-rays, CT scans, and MRI machines to view internal structures of the human body for disease diagnosis. What category of healthcare IT does this represent?", options: ["Telemedicine", "Medical Imaging", "Electronic Health Records", "Health Analytics"], answer: "b" },
    { id: 37, q: "A computer user turns on their PC. The processor automatically begins executing startup instructions located in a permanent ROM chip to check hardware components before loading the OS into RAM. What system component is executing these initial steps?", options: ["Supervisor / Kernel", "Basic Input/Output System (BIOS)", "Application Software", "Device Driver"], answer: "b" },
    { id: 38, q: "A corporate consultant travels frequently and relies on a high-performance laptop specifically designed for heavy mathematical computations, complex 3D modeling, and engineering applications. Which computer category does this machine fit?", options: ["Microcomputer / Workstation", "Mainframe", "Supercomputer", "Microcontroller"], answer: "a" },
    { id: 39, q: "A student opens multiple applications at once—listening to streaming audio while typing a term paper and downloading a lecture video. The operating system handles these tasks concurrently by alternating processor time among them. What feature is operating?", options: ["Multitasking", "Spooling", "Virtual Memory", "File Management"], answer: "a" },
    { id: 40, q: "An editor receives a draft document saved in .docx format and needs to save it in a universally viewable format that preserves all original layout, fonts, and graphics across any operating system platform without alteration. Which format should be chosen?", options: [".txt (ASCII)", ".pdf (Portable Document Format)", ".bmp (Bitmap)", ".html (Hypertext)"], answer: "b" },
    { id: 41, q: "A company wants to store customer names, addresses, and transaction histories in a structured format where individual tables can be linked together through common key fields, such as a Customer ID. What database system should be deployed?", options: ["Relational Database", "Flat-file Database", "Object-only Database", "Unstructured Database"], answer: "a" },
    { id: 42, q: "A user leaves their home computer running and accesses files stored on it remotely over the Internet. What umbrella term describes this digital environment of connected networks and online communication spaces?", options: ["World Wide Web", "Cyberspace", "Local Area Network", "Intranet"], answer: "b" },
    { id: 43, q: "A user opens a website that displays a combination of written text, illustrative photos, embedded background audio, and playing video clips simultaneously. What form of media presentation is this?", options: ["Vector Graphics", "Multimedia", "ASCII Text", "Virtual Reality"], answer: "b" },
    { id: 44, q: "A school district conducts classes where students are physically located at home while interacting with teachers over digital video platforms and learning management systems. Which term specifically describes this setup based on geographical separation?", options: ["Distance Learning", "Desktop Publishing", "Synchronous Automation", "Telecommuting"], answer: "a" },
    { id: 45, q: "An online store collects customer browsing histories, location data, and purchase patterns to display custom product recommendations. What privacy concern is highlighted when data is gathered in the background without explicit user awareness?", options: ["Digital Divide", "Online Tracking and Data Misuse", "Software Compatibility", "Zero-Day Exploitation"], answer: "b" },
    { id: 46, q: "A tech student wants to explain the difference between the Internet and the World Wide Web to a classmate. Which statement correctly identifies the relationship between the two?", options: ["The Web is the physical global infrastructure, while the Internet is a service running on top of it.", "The Internet is the global network infrastructure, while the Web is an interconnected multimedia service that operates over the Internet.", "The Internet and the Web are identical terms describing the exact same service.", "The Web replaced the Internet as the primary global computer network."], answer: "b" },
    { id: 47, q: "A human resource department uses software to manage employee contacts, track daily schedules, organize appointments, and manage task to-do lists. What software type is being used?", options: ["Personal Information Manager (PIM)", "Computer-Aided Design (CAD)", "Integrated Suite", "Utility Program"], answer: "a" },
    { id: 48, q: "A developer needs to write a set of precise, step-by-step instructions and logical rules for an AI system to process inputs and produce automated decisions. What is this step-by-step procedure called?", options: ["Algorithm", "Data File", "Buffer", "Shortcut Key"], answer: "a" },
    { id: 49, q: "An office employee wants to create a standard layout for monthly status reports, complete with pre-set margins, company logos, and defined heading fonts so that future reports follow the same design. What feature should be created?", options: ["Template", "Macro", "Query", "Driver"], answer: "a" },
    { id: 50, q: "An IT department notices that several computers are infected with malware that systematically locked all local document files using strong encryption and displayed a screen message demanding a cryptocurrency payment to obtain the decryption key. What type of malware is involved?", options: ["Spyware", "Ransomware", "Trojan Horse", "Phishing"], answer: "b" },
    { id: 51, q: "A student in an urban area has access to high-speed fiber internet and a high-end laptop, whereas a student in a remote rural village can only access the internet using a basic smartphone with intermittent mobile data. What social challenge does this difference illustrate?", options: ["Convergence", "Digital Divide", "Pervasiveness", "Social Engineering"], answer: "b" },
    { id: 52, q: "A photographer takes high-resolution photos that require detailed color gradients and fine detail. When saving these images for professional printing on both Windows and Mac platforms, which high-resolution graphic file format is standard?", options: [".gif", ".tiff", ".txt", ".wav"], answer: "b" },
    { id: 53, q: "An employee accidentally deletes an important line of text in a word processing document and needs to restore it immediately using a keyboard combination rather than navigating menus. Which key combination or utility feature achieves this?", options: ["Undo", "Cut and Paste", "Find and Replace", "Defragmenter"], answer: "a" },
    { id: 54, q: "A business analyst is working with datasets containing millions of real-time transactions gathered from mobile devices, sensors, and social media platforms that exceed the capacity of standard database tools. What term describes this massive volume of information?", options: ["Big Data", "Meta Data", "Cloud Files", "Secondary Data"], answer: "a" },
    { id: 55, q: "A desktop computer screen displays small pictorial figures that represent software applications, files, or folders, allowing the user to double-click them to launch programs. What interface component are these visual graphics?", options: ["Menus", "Icons", "Status Bars", "Taskbars"], answer: "b" },
    { id: 56, q: "During a presentation, a speaker moves the mouse pointer over a small icon on the screen, causing a tiny text box to appear temporarily with a brief explanation of the button's function. What is this interface feature called?", options: ["Rollover", "Cascading menu", "Pop-up window", "Title bar"], answer: "a" },
    { id: 57, q: "A marketing specialist needs to blend formatted text, high-resolution imported images, custom type styles, and page layouts to prepare a magazine for commercial printing. Which specialized application software is required?", options: ["Word Processing Software", "Desktop Publishing (DTP) Software", "Spreadsheet Software", "Presentation Graphics Software"], answer: "b" },
    { id: 58, q: "A smart thermostat in an office building contains a micro-chip running a specialized operating system built directly into its internal memory to regulate room temperatures automatically. What type of OS is present?", options: ["Network Operating System", "Embedded Operating System", "Stand-alone Operating System", "Legacy Operating System"], answer: "b" },
    { id: 59, q: "An online publisher uploads sound files containing music compressed from CD-quality tracks while retaining high audio quality for streaming online. Which audio file extension is commonly used for this purpose?", options: [".mp3", ".mid", ".wav", ".au"], answer: "a" },
    { id: 60, q: "A user wants to make ethical decisions regarding their digital activities. Instead of asking 'Can I copy and distribute this copyrighted software code?', what key question represents an ethical mindset?", options: ["'How fast can I download it?'", "'Should I copy and distribute it?'", "'Will the computer allow me to perform this action?'", "'Is the software compatible with my OS?'"], answer: "b" }
];

function renderQuiz() {
    const wrapper = document.getElementById('questions-wrapper');
    let html = '';

    quizData.forEach((item, index) => {
        const optionKeys = ['a', 'b', 'c', 'd'];
        html += `
            <div class="question-card" id="card-${item.id}">
                <div class="question-text">${index + 1}. ${item.q}</div>
                <ul class="options-list">
                    ${item.options.map((opt, i) => {
                        const key = optionKeys[i];
                        return `
                            <li class="option-item">
                                <label class="option-label" id="label-${item.id}-${key}">
                                    <input type="radio" name="q${item.id}" value="${key}" onchange="clearMissingState(${item.id})">
                                    <span><strong>${key.toUpperCase()})</strong> ${opt}</span>
                                </label>
                            </li>
                        `;
                    }).join('')}
                </ul>
            </div>
        `;
    });

    wrapper.innerHTML = html;
}

function clearMissingState(id) {
    const card = document.getElementById(`card-${id}`);
    if (card) {
        card.classList.remove('missing-answer');
    }
}

function gradeQuiz() {
    let unansweredIds = [];

    // Check for empty answers
    quizData.forEach(item => {
        const selected = document.querySelector(`input[name="q${item.id}"]:checked`);
        const card = document.getElementById(`card-${item.id}`);
        
        if (!selected) {
            unansweredIds.push(item.id);
            if (card) card.classList.add('missing-answer');
        } else {
            if (card) card.classList.remove('missing-answer');
        }
    });

    // If there are unanswered questions, halt submission
    if (unansweredIds.length > 0) {
        alert(`Please answer all questions before submitting. You have ${unansweredIds.length} unanswered question(s).`);
        const firstMissingCard = document.getElementById(`card-${unansweredIds[0]}`);
        if (firstMissingCard) {
            firstMissingCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        return;
    }

    let score = 0;
    const total = quizData.length;

    quizData.forEach(item => {
        const card = document.getElementById(`card-${item.id}`);
        const selected = document.querySelector(`input[name="q${item.id}"]:checked`);
        const correctKey = item.answer;

        card.classList.remove('correct-answer', 'incorrect-answer', 'missing-answer');
        ['a', 'b', 'c', 'd'].forEach(k => {
            const lbl = document.getElementById(`label-${item.id}-${k}`);
            if (lbl) lbl.classList.remove('is-correct', 'is-wrong');
        });

        const correctLabel = document.getElementById(`label-${item.id}-${correctKey}`);
        if (correctLabel) correctLabel.classList.add('is-correct');

        if (selected) {
            const userChoice = selected.value;
            if (userChoice === correctKey) {
                score++;
                card.classList.add('correct-answer');
            } else {
                card.classList.add('incorrect-answer');
                const userLabel = document.getElementById(`label-${item.id}-${userChoice}`);
                if (userLabel) userLabel.classList.add('is-wrong');
            }
        }
    });

    const resultPanel = document.getElementById('result-panel');
    const scoreText = document.getElementById('score-text');
    scoreText.innerText = `Your Score: ${score} / ${total} (${((score / total) * 100).toFixed(1)}%)`;
    resultPanel.style.display = 'block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetQuiz() {
    document.getElementById('quiz-form').reset();
    document.getElementById('result-panel').style.display = 'none';

    quizData.forEach(item => {
        const card = document.getElementById(`card-${item.id}`);
        if (card) {
            card.classList.remove('correct-answer', 'incorrect-answer', 'missing-answer');
        }
        ['a', 'b', 'c', 'd'].forEach(k => {
            const lbl = document.getElementById(`label-${item.id}-${k}`);
            if (lbl) lbl.classList.remove('is-correct', 'is-wrong');
        });
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
</script>
